pre-commit:
  parallel: true
  commands:
    pint:
      glob: '*.php'
      run: vendor/bin/pint {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{ts,vue,js}'
      run: pnpm eslint --fix {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
